[project]
name = "isomorph"
version = "0.1.0"
description = "Python RTL to unflattened SystemVerilog and VHDL"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Steve Groom" }]
keywords = ["rtl", "fpga", "hdl", "systemverilog", "vhdl", "verilog"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.urls]
Homepage = "https://github.com/steve-groom/isomorph"
Source = "https://github.com/steve-groom/isomorph"

[project.scripts]
isomorph = "isomorph.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["isomorph", "isomorph.*"]

[tool.setuptools.package-data]
isomorph = ["runtime/*.c", "runtime/*.h"]
