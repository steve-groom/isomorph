[project]
name = "isomorph"
version = "0.1.0"
description = "Python RTL to unflattened SystemVerilog and VHDL"
requires-python = ">=3.11"
readme = "INSTALL.txt"

[project.scripts]
isomorph = "isomorph.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["isomorph", "isomorph.*"]

[tool.setuptools.package-data]
isomorph = ["runtime/*.c", "runtime/*.h"]
